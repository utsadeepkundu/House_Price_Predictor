[project]
name = "real-estate-predictor"
version = "1.0.0"
description = "Machine learning based real estate prediction application"
requires-python = ">=3.12,<3.15"

dependencies = [
    "fastapi",
    "pandas",
    "numpy",
    "scikit-learn==1.9.0",
    "joblib",
    "uvicorn"
]

[tool.vercel.scripts]
build = "npm ci && npm run build"